name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:server
      - run: npm run build:extension
      - uses: actions/upload-artifact@v4
        with:
          name: farm-rpg-quest-tracker-extension
          path: extension/dist
